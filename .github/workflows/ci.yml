name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm --filter @ds/e2e-tests exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - run: pnpm test:e2e
      - run: pnpm pack:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            tests/*/results
            **/test-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      DS_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sathwik/tokens build
      - run: pnpm --filter @sathwik/ui build
      - run: pnpm --filter @ds/storybook build
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: tests/visual/test-results
          if-no-files-found: ignore
