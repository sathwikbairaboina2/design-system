# Four static servers on the ports the app is built for (assetPrefix and remotes.json use localhost:544x).

server {
  listen 5440;
  root /srv/shell;
  location / {
    try_files $uri /index.html;
  }
  location ~ (remoteEntry\.js|mf-manifest\.json|remotes\.json)$ {
    add_header Cache-Control "no-cache" always;
  }
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

server {
  listen 5441;
  root /srv/billing;
  add_header Access-Control-Allow-Origin * always;
  location / {
    add_header Access-Control-Allow-Origin * always;
    try_files $uri =404;
  }
  location ~ (remoteEntry\.js|mf-manifest\.json)$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache" always;
  }
  location /static/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

server {
  listen 5442;
  root /srv/catalog;
  add_header Access-Control-Allow-Origin * always;
  location / {
    add_header Access-Control-Allow-Origin * always;
    try_files $uri =404;
  }
  location ~ (remoteEntry\.js|mf-manifest\.json)$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache" always;
  }
  location /static/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

server {
  listen 5444;
  root /srv/storybook;
  location / {
    try_files $uri $uri/ =404;
  }
}
